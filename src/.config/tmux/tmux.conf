##
## -- Settings --
##
set -g base-index 1               # start windows numbering at 1
set -g default-terminal "screen-256color"
set -g mode-keys vi               # vim like keys
set -g mouse on                   # Enable mouse
set -g pane-base-index 1          # make pane numbering consistent with windows
set -g extended-keys on           # support modified enter keys
set -g focus-events on            # for focus tracking
set -g extended-keys-format csi-u # Pi works best with csi-u
# set -g pane-border-format "#P: #{pane_current_path}"
# set -g pane-border-status off # off|top|bottom
set -g renumber-windows on        # renumber windows when a window is closed
set -g set-clipboard on           # OSC 52 clipboard support
set -g allow-passthrough on       # let OSC 52 pass through to terminal
set -g set-titles on
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left "#[fg=#7aa2f7,bold] #{session_name} "
set -g status-left-length 20
set -g status-right "#[fg=#565f89]%R #[fg=#7aa2f7]%d-%b-%y "
set -g status-right-length 30

# Window list
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#c0caf5,bg=#292e42,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#292e42,fg=#c0caf5"

##
## -- Mappings --
##
set -g prefix C-a

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -c "#{pane_current_path}"

## Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r command-prompt -I "#{window_name}" "rename-window '%%'"

## Reload configuration
bind R source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'

